# Docker Compose for Neo4j integration tests (S11-sink-neo4j).
#
# Usage:
#   export N4J_PW=test
#   docker compose -f tests/compose/neo4j.yml up -d
#   NEO4J_URI=bolt://localhost:7687 NEO4J_PASSWORD_ENV=N4J_PW N4J_PW=test \
#     cargo nextest run --test sink_neo4j -- --ignored
#   docker compose -f tests/compose/neo4j.yml down -v

services:
  neo4j:
    image: neo4j:5
    ports:
      - "7474:7474"   # HTTP browser
      - "7687:7687"   # Bolt
    environment:
      NEO4J_AUTH: "neo4j/${N4J_PW:-test}"
      NEO4J_PLUGINS: '[]'
      NEO4J_dbms_memory_heap_initial__size: "256m"
      NEO4J_dbms_memory_heap_max__size: "512m"
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "${N4J_PW:-test}", "RETURN 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
