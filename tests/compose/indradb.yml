# Docker Compose file for IndraDB integration tests.
#
# Usage:
#   docker compose -f tests/compose/indradb.yml up -d
#   INDRADB_ENDPOINT=http://localhost:27615 cargo nextest run --test sink_indradb -- --ignored
#   docker compose -f tests/compose/indradb.yml down
#
# IndraDB exposes its gRPC API on port 27615.
# The memory datastore is used for tests (no persistent data).

services:
  indradb:
    image: indradb/indradb:latest
    ports:
      - "27615:27615"
    # Use the memory datastore for fast, isolated test runs.
    command: ["memory"]
    healthcheck:
      # IndraDB does not ship a native HTTP health endpoint; use nc to probe gRPC port.
      test: ["CMD-SHELL", "nc -z localhost 27615 || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 3s
