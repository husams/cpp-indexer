[package]
name = "cpp_indexer"
version = "0.1.0"
edition = "2021"
description = "C++ codebase indexer using libclang, staging to Parquet, with Neo4j and IndraDB sinks"
license = "Apache-2.0"
autobins = false

[[bin]]
name = "cxg-index"
path = "src/bin/index.rs"

[[bin]]
name = "cxg-resolve-cross-repo"
path = "src/bin/resolve_cross_repo.rs"

[[bin]]
name = "cxg-daemon"
path = "src/bin/daemon.rs"

[features]
## Expose MockSink to downstream crates (e.g. integration test helpers).
## Always enabled in `cargo test`; do NOT enable in production builds.
test-mock = []

[dependencies]
clang = { version = "2", features = ["clang_6_0"] }
rayon = "1"
tokio = { version = "1", features = ["full"] }
axum = "0.7"
tower = "0.5"
tower-http = "0.5"
git2 = "0.18"
neo4rs = "0.7"
indradb-proto = "5"
indradb-lib = "5"
arrow = "53"
parquet = { version = "53", features = ["async"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "1"
anyhow = "1"
blake3 = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
clap = { version = "4", features = ["derive"] }
async-trait = "0.1"
prometheus = "0.13"
rocksdb = "0.22"
num_cpus = "1"
glob = "0.3"
uuid = { version = "1.23.1", features = ["v5"] }
tonic = "0.12"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
tracing-test = { version = "0.2", features = ["no-env-filter"] }
futures = "0.3"
walkdir = "2"

[[test]]
name = "autodetect"
path = "tests/integration/autodetect.rs"

[[test]]
name = "phase1_base"
path = "tests/integration/phase1_base.rs"
required-features = []

[[test]]
name = "phase3"
path = "tests/integration/phase3.rs"
required-features = []

[[test]]
name = "sink_neo4j"
path = "tests/integration/sink_neo4j.rs"

[[test]]
name = "sink_indradb"
path = "tests/sink_indradb.rs"
required-features = []

[[test]]
name = "m1_exit_gate"
path = "tests/integration/m1_exit_gate.rs"
required-features = ["test-mock"]
