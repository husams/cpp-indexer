[package]
name = "cpp_indexer"
version = "0.1.0"
edition = "2021"
description = "C++ codebase indexer using libclang, staging to Parquet, with Neo4j and IndraDB sinks"
license = "Apache-2.0"
autobins = false

[[bin]]
name = "cxg-index"
path = "src/bin/index.rs"

[[bin]]
name = "cxg-resolve-cross-repo"
path = "src/bin/resolve_cross_repo.rs"

[[bin]]
name = "cxg-daemon"
path = "src/bin/daemon.rs"

[dependencies]
clang = "2"
rayon = "1"
tokio = { version = "1", features = ["full"] }
axum = "0.7"
tower = "0.5"
tower-http = "0.5"
git2 = "0.18"
neo4rs = "0.7"
indradb-proto = "5"
indradb-lib = "5"
arrow = "53"
parquet = "53"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "1"
anyhow = "1"
blake3 = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
clap = { version = "4", features = ["derive"] }
async-trait = "0.1"
prometheus = "0.13"
rocksdb = "0.22"
num_cpus = "1"
glob = "0.3"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
tracing-test = { version = "0.2", features = ["no-env-filter"] }

[[test]]
name = "autodetect"
path = "tests/integration/autodetect.rs"
