[project]
name = "cidx-indexer"
version = "0.52.0"
description = "Python reference implementation and query API for cidx"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "libclang>=18.1.1; sys_platform == 'darwin'",
    "clang>=21.1.7; sys_platform != 'darwin'",
    "ipython>=9.15.0",
]

[project.optional-dependencies]
dev = ["pytest>=9.1.0", "pytest-bdd>=8.1"]

[project.scripts]
indexer = "indexer.cli:main"
cidx-python = "indexer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["indexer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.0",
    "pytest-bdd>=8.1",
]
