[project]
name = "cidx-indexer"
dynamic = ["version"]
description = "Python storage and read-query SDK for cidx"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "libclang>=18.1.1; sys_platform == 'darwin'",
    "clang>=21.1.7; sys_platform != 'darwin'",
    "ipython>=9.15.0",
]

[project.optional-dependencies]
dev = ["pytest>=9.1.0", "pytest-bdd>=8.1"]

[project.scripts]
indexer = "indexer.cli:main"
cidx-python = "indexer.cli:main"
cidx-agent-python = "indexer.agent_tools:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["indexer"]

[tool.hatch.version]
path = "indexer/_version.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", ".."]
markers = ["spec: executable BDD specification"]

[dependency-groups]
dev = [
    "pytest>=9.1.0",
    "pytest-bdd>=8.1",
]
