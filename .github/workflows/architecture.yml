name: architecture

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contract:
    runs-on: cpp-indexer-runner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check module and dependency contract
        run: python scripts/check_architecture.py --manifest architecture/cidx-module-manifest.json
      - name: Check platform architecture contract
        run: python scripts/check_platform_contract.py --module-manifest architecture/cidx-module-manifest.json
      - name: Run architecture mutation tests
        run: python tests/architecture_test.py
      - name: Run platform contract mutation tests
        run: python tests/platform_contract_test.py
      - name: Run self-host architecture report mutation tests
        run: python tests/self_host_architecture_test.py

  self-host:
    name: Self-host architecture policy report
    runs-on: cpp-indexer-runner
    container: ubuntu:24.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM/Clang 22 toolchain
        run: |
          apt-get update
          apt-get install \
            --no-install-recommends -y ca-certificates curl gnupg python3
          curl --fail --location --silent --show-error \
            https://apt.llvm.org/llvm-snapshot.gpg.key --output /tmp/llvm-snapshot.gpg.key
          test "$(gpg --show-keys --with-colons /tmp/llvm-snapshot.gpg.key \
            | awk -F: '$1 == "fpr" { print $10; exit }')" = \
            6084F3CF814B57C1CF12EFD515CF4D18AF4F7421
          gpg --dearmor --yes --output /tmp/llvm-apt.gpg \
            /tmp/llvm-snapshot.gpg.key
          install -m 0644 /tmp/llvm-apt.gpg /usr/share/keyrings/llvm-apt.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/llvm-apt.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-22 main" \
            | tee /etc/apt/sources.list.d/llvm-22.list >/dev/null
          apt-get update
          apt-get install \
            --no-install-recommends -y gcc-13 g++-13 \
            clang-22 clang-tools-22 cmake libclang-22-dev \
            libclang-common-22-dev libclang-cpp22 libsqlite3-dev \
            llvm-22 llvm-22-dev ninja-build
      - name: Configure and build cidx
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=gcc-13
          -DCMAKE_CXX_COMPILER=g++-13
          -DLLVM_DIR=/usr/lib/llvm-22/lib/cmake/llvm
          -DClang_DIR=/usr/lib/llvm-22/lib/cmake/clang
          && cmake --build build --parallel 2 --target cidx
      - name: Build a throwaway self-index and generate the report
        run: scripts/self_host_index.sh --build-dir build --out self-host-report.json
      - name: Upload self-host architecture report
        uses: actions/upload-artifact@v4
        with:
          name: self-host-architecture-report
          path: self-host-report.json
