name: contract-check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  release-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Validate generated contracts and release inputs
        run: uv run --project python python scripts/check_release_contract.py
      - name: Validate raw SQLite caller boundaries
        run: python3 scripts/check_raw_db_boundaries.py
      - name: Validate SQLite-free focused storage ports
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang
          python3 scripts/check_storage_ports_header.py
      - name: Validate Python contract tests
        run: uv run --project python pytest python/tests/test_contracts.py
