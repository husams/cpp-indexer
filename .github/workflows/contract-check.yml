name: contract-check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  release-contract:
    runs-on: cpp-indexer-runner
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Validate generated contracts and release inputs
        run: uv run --project python python scripts/check_release_contract.py
      - name: Validate Python contract tests
        run: uv run --project python pytest python/tests/test_contracts.py
