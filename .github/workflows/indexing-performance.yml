name: Indexing performance and mode equivalence

# S-078 regression guard for the published production indexing SLO.
#
# Timing on a shared runner is not a gate: it is noisy, and a red build that
# means "the runner was busy" trains people to ignore red builds. What is
# gated on every change is the part that is deterministic and is also the part
# a performance change actually breaks — that the faster modes still publish
# the same facts, that the operating bounds still hold when they are squeezed,
# and that the telemetry the measurement gate is fitted against is still
# produced. The production-scale timing matrix runs on a schedule instead, and
# publishes its report as an artifact for the SLO to be re-derived from.
#
# Contract and thresholds: benchmarks/indexing/slo.py
# Matrix:                  benchmarks/indexing/integrated.py
# Measurement gate:        benchmarks/indexing/production.py
# Published SLO:           docs/indexing-slo.md

on:
  pull_request:
    paths:
      - 'src/ast/**'
      - 'src/index/**'
      - 'src/storage/**'
      - 'src/profile/**'
      - 'src/application/**'
      - 'src/cli/**'
      - 'benchmarks/indexing/**'
      - 'docs/indexing-slo.md'
      - '.github/workflows/indexing-performance.yml'
  push:
    branches: [main]
    paths:
      - 'src/ast/**'
      - 'src/index/**'
      - 'src/storage/**'
      - 'src/profile/**'
      - 'src/application/**'
      - 'src/cli/**'
      - 'benchmarks/indexing/**'
      - '.github/workflows/indexing-performance.yml'
  schedule:
    # Weekly, Monday 03:17 UTC. Production-scale runs are expensive; the
    # affordable subset above is what guards an individual change.
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      scale_files:
        description: Translation units in the production-scale corpus.
        type: string
        default: '1000'

permissions:
  contents: read

jobs:
  # Seconds, no build, no corpus: the SLO contract and the matrix's own
  # decision rules. A change that widens an allowance or drops a residual term
  # fails here with a test name that says which rule moved.
  contract:
    name: SLO contract and matrix decision rules
    runs-on: cpp-indexer-runner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run the offline benchmark decision suites
        run: |
          python3 -m unittest \
            benchmarks.indexing.slo_test \
            benchmarks.indexing.integrated_test \
            benchmarks.indexing.publish_slo_test \
            benchmarks.indexing.production_test
      - name: Reject an unparseable harness
        run: |
          python3 -m py_compile \
            benchmarks/indexing/slo.py \
            benchmarks/indexing/integrated.py \
            benchmarks/indexing/publish_slo.py \
            benchmarks/indexing/production.py

  # Minutes, one build, a deliberately small corpus. This is the affordable
  # subset: it proves serial/parallel, cached/fresh, reuse-on/off,
  # inline/deferred transforms and in-place/clean-rebuild still publish one
  # fact set, and that the documented budgets still hold at their tightest
  # accepted settings.
  equivalence:
    name: Cross-mode equivalence and operating bounds
    runs-on: cpp-indexer-runner
    container: ubuntu:24.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install Git for the containerized checkout
        run: |
          apt-get update
          apt-get install --no-install-recommends -y ca-certificates git
      - uses: actions/checkout@v4
      - name: Trust the mounted checkout for containerized Git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install LLVM/Clang 22 toolchain
        run: |
          apt-get update
          apt-get install \
            --no-install-recommends -y ca-certificates curl gnupg
          curl --fail --location --silent --show-error \
            https://apt.llvm.org/llvm-snapshot.gpg.key --output /tmp/llvm-snapshot.gpg.key
          test "$(gpg --show-keys --with-colons /tmp/llvm-snapshot.gpg.key \
            | awk -F: '$1 == "fpr" { print $10; exit }')" = \
            6084F3CF814B57C1CF12EFD515CF4D18AF4F7421
          gpg --dearmor --yes --output /tmp/llvm-apt.gpg \
            /tmp/llvm-snapshot.gpg.key
          install -m 0644 /tmp/llvm-apt.gpg /usr/share/keyrings/llvm-apt.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/llvm-apt.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-22 main" \
            | tee /etc/apt/sources.list.d/llvm-22.list >/dev/null
          apt-get update
          apt-get install \
            --no-install-recommends -y gcc-13 g++-13 g++ zlib1g-dev \
            clang-22 clang-tools-22 cmake libclang-22-dev \
            libclang-common-22-dev libclang-cpp22 libsqlite3-dev \
            llvm-22 llvm-22-dev ninja-build python3 sqlite3
      - name: Configure with the matching LLVM/Clang toolchain
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=gcc-13
          -DCMAKE_CXX_COMPILER=g++-13
          -DLLVM_DIR=/usr/lib/llvm-22/lib/cmake/llvm
          -DClang_DIR=/usr/lib/llvm-22/lib/cmake/clang
      - name: Build cidx
        run: cmake --build build --parallel 2 --target cidx
      - name: Run the cross-mode equivalence and bounds matrix
        run: >-
          python3 benchmarks/indexing/integrated.py
          --cidx build/cidx
          --build-dir build
          --profile quick
          --equivalence-shape header-heavy
          --skip-qualification-tests
          --work-root "$RUNNER_TEMP/s078-equivalence"
          --output "$RUNNER_TEMP/s078-equivalence.json"
      - name: Upload the matrix report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: indexing-equivalence-report
          path: ${{ runner.temp }}/s078-equivalence.json
          if-no-files-found: warn

  # Hours, scheduled. Produces the report the published SLO is re-derived
  # from. It is deliberately not a pull-request gate: a shared runner cannot
  # produce a defensible absolute timing, and the report records its own
  # `host_quiescence` so a contended run is visible rather than averaged in.
  production-scale:
    name: Production-scale measurement matrix
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: cpp-indexer-runner
    container: ubuntu:24.04
    timeout-minutes: 600
    env:
      DEBIAN_FRONTEND: noninteractive
      SCALE_FILES: ${{ inputs.scale_files || '1000' }}
    steps:
      - name: Install Git for the containerized checkout
        run: |
          apt-get update
          apt-get install --no-install-recommends -y ca-certificates git
      - uses: actions/checkout@v4
      - name: Trust the mounted checkout for containerized Git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install LLVM/Clang 22 toolchain
        run: |
          apt-get update
          apt-get install \
            --no-install-recommends -y ca-certificates curl gnupg
          curl --fail --location --silent --show-error \
            https://apt.llvm.org/llvm-snapshot.gpg.key --output /tmp/llvm-snapshot.gpg.key
          test "$(gpg --show-keys --with-colons /tmp/llvm-snapshot.gpg.key \
            | awk -F: '$1 == "fpr" { print $10; exit }')" = \
            6084F3CF814B57C1CF12EFD515CF4D18AF4F7421
          gpg --dearmor --yes --output /tmp/llvm-apt.gpg \
            /tmp/llvm-snapshot.gpg.key
          install -m 0644 /tmp/llvm-apt.gpg /usr/share/keyrings/llvm-apt.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/llvm-apt.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-22 main" \
            | tee /etc/apt/sources.list.d/llvm-22.list >/dev/null
          apt-get update
          apt-get install \
            --no-install-recommends -y gcc-13 g++-13 g++ zlib1g-dev \
            clang-22 clang-tools-22 cmake libclang-22-dev \
            libclang-common-22-dev libclang-cpp22 libsqlite3-dev \
            llvm-22 llvm-22-dev ninja-build python3 sqlite3
      - name: Configure with the matching LLVM/Clang toolchain
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=gcc-13
          -DCMAKE_CXX_COMPILER=g++-13
          -DLLVM_DIR=/usr/lib/llvm-22/lib/cmake/llvm
          -DClang_DIR=/usr/lib/llvm-22/lib/cmake/clang
      - name: Build cidx
        run: cmake --build build --parallel 2 --target cidx
      # The shipped automatic topology: an SLO describes the mode that ships.
      - name: Measure the shipped configuration
        run: >-
          python3 benchmarks/indexing/production.py
          --cidx build/cidx
          --checkout .
          --skip-self-index
          --profile full
          --scale-files "$SCALE_FILES"
          --trials 3
          --work-root "$RUNNER_TEMP/s078-shipped"
          --output "$RUNNER_TEMP/s078-shipped.json"
      # The serial topology additionally publishes the translation-unit cache
      # and dependency-invalidation taxonomies, which the shipped mode does not.
      - name: Measure the serial topology for the cache and dependency taxonomy
        run: >-
          python3 benchmarks/indexing/production.py
          --cidx build/cidx
          --checkout .
          --skip-self-index
          --skip-sqlite-matrix
          --index-jobs 1
          --profile full
          --scale-files "$SCALE_FILES"
          --trials 3
          --work-root "$RUNNER_TEMP/s078-serial"
          --output "$RUNNER_TEMP/s078-serial.json"
      - name: Run the full integrated matrix
        run: >-
          python3 benchmarks/indexing/integrated.py
          --cidx build/cidx
          --build-dir build
          --profile full
          --equivalence-shape header-heavy
          --skip-qualification-tests
          --work-root "$RUNNER_TEMP/s078-integrated"
          --output "$RUNNER_TEMP/s078-integrated.json"
      - name: Upload the production-scale reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: indexing-production-scale-reports
          path: |
            ${{ runner.temp }}/s078-shipped.json
            ${{ runner.temp }}/s078-serial.json
            ${{ runner.temp }}/s078-integrated.json
          if-no-files-found: warn
