name: CIDX verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tla-spec:
    name: TLA+ syntax and TLC
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up pinned Java runtime
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run normative TLA+ gate
        run: spec/tla/tools/check.sh
      - name: Run invariant mutation regression
        run: spec/tla/tools/check-regression.sh

  cpp-default:
    name: C++ default tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install LLVM/Clang 22 toolchain
        run: |
          curl --fail --location --silent --show-error \
            https://apt.llvm.org/llvm.sh --output /tmp/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 22 all
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            cmake libsqlite3-dev ninja-build
      - name: Configure with the matching LLVM/Clang toolchain
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=clang-22
          -DCMAKE_CXX_COMPILER=clang++-22
          -DLLVM_DIR=/usr/lib/llvm-22/lib/cmake/llvm
          -DClang_DIR=/usr/lib/llvm-22/lib/cmake/clang
      - name: Build
        run: cmake --build build --parallel 2
      - name: Run C++ default tests
        run: ctest --test-dir build -L default --output-on-failure
