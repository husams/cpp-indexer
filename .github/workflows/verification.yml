name: CIDX verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tla-spec:
    name: TLA+ syntax and TLC
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up pinned Java runtime
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run normative TLA+ gate
        run: spec/tla/tools/check.sh

  cpp-default:
    name: C++ default tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install C++ toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            clang cmake libclang-cpp-dev libsqlite3-dev llvm-dev ninja-build
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel 2
      - name: Run C++ default tests
        run: ctest --test-dir build -L default --output-on-failure
