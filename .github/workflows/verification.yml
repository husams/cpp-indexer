name: CIDX verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tla-spec:
    name: TLA+ syntax and TLC
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up pinned Java runtime
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run normative TLA+ gate
        run: spec/tla/tools/check.sh
      - name: Run invariant mutation regression
        run: spec/tla/tools/check-regression.sh

  cpp-default:
    name: C++ default tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install C++ toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            clang-18 clang-tools-18 cmake libclang-18-dev \
            libclang-common-18-dev libclang-cpp18 libsqlite3-dev \
            llvm-18 llvm-18-dev ninja-build
      - name: Configure with the matching LLVM/Clang toolchain
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=clang-18
          -DCMAKE_CXX_COMPILER=clang++-18
          -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm
          -DClang_DIR=/usr/lib/llvm-18/lib/cmake/clang
      - name: Build
        run: cmake --build build --parallel 2
      - name: Run C++ default tests
        run: ctest --test-dir build -L default --output-on-failure
